name: Backend CD

on:
  push:
    branches: [ main ]
    paths:
      - '**'
      - '.github/workflows/backend-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to DigitalOcean Droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.DROPLET_IP }}
          username: ${{ secrets.DROPLET_USER || 'root' }}
          key: ${{ secrets.MY_PRIVATE_KEY }}
          passphrase: ${{ secrets.PRIVATEKEY_PASSPHRASE }}
          script: |
            # Create the project directory if it doesn't exist
            mkdir -p ~/loveIgnite-backend
            cd ~/loveIgnite-backend 
            
            # If the directory is not a git repo, clone it
            if [ ! -d ".git" ]; then
              git clone https://github.com/kumarchetan-1/loveIgnite-backend.git .
            else
              git pull origin main
            fi
            
            # Restart containers
            # docker-compose up -d --build
            
            # Clean up old images
            # docker image prune -f
