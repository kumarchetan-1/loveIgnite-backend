name: Backend CD

on:
  push:
    branches: [ main ]
    paths:
      - '**'
      - '.github/workflows/backend-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to DigitalOcean Droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.DROPLET_IP }}
          username: ${{ secrets.DROPLET_USER || 'root' }}
          key: ${{ secrets.MY_PRIVATE_KEY }}
          passphrase: ${{ secrets.PRIVATEKEY_PASSPHRASE }}
          script: |
            cd ~/loveIgnite-backend
            
            # Pull latest changes
            git pull origin main
            
            # Ensure .env exists
            touch .env
            
            # Robustly inject or update secrets in .env
            update_env() {
              key=$1
              val=$2
              if [ -n "$val" ]; then
                if grep -q "^${key}=" .env; then
                  sed -i "s@^${key}=.*@${key}=${val}@" .env
                else
                  echo "${key}=${val}" >> .env
                fi
              fi
            }
            
            update_env "BREVO_API_KEY" "${{ secrets.BREVO_SMTP_API_KEY }}"
            update_env "JWT_SECRET" "${{ secrets.JWT_SECRET }}"
            
            # Restart containers
            docker-compose up -d --build
            
            # Clean up old images
            docker image prune -f
