name: Backend CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - '**'
      - '.github/workflows/backend-deploy.yml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/loveignite-backend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to DigitalOcean Droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.DROPLET_IP }}
          username: ${{ secrets.DROPLET_USER || 'root' }}
          key: ${{ secrets.MY_PRIVATE_KEY }}
          passphrase: ${{ secrets.PRIVATEKEY_PASSPHRASE }}
          script: |
            cd ~/loveIgnite-backend
            
            # Pull latest docker-compose and config files
            git pull origin main
            
            # Log in to GHCR on the droplet
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Pull the new image and restart
            docker-compose pull app
            docker-compose up -d
            
            # Clean up
            docker image prune -f
